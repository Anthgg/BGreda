# Cloud Build — BGreda Migración Alembic
#
# Job EXPLÍCITO de migración de base de datos.
# NUNCA se ejecuta automáticamente en el startup del contenedor web.
#
# Solo ejecutar cuando MIGRATION_REQUIRED: YES
# (cuando PRODUCTION_ALEMBIC_CURRENT != CODE_HEAD)
#
# Ejecutar manualmente:
#   gcloud builds submit --config cloudbuild.migrate.yaml .
#
# El job:
#   1. Verifica que no hay múltiples heads de Alembic (head_count == 1)
#   2. Compara current vs head
#   3. Si ya está actualizado → salida exitosa sin migrar
#   4. Si está desactualizado → alembic upgrade head
#
# NOTA sobre `$$`: dentro de los `args` de un step, Cloud Build sustituye
# todo lo que parezca `$VAR` ANTES de que bash lo vea. Las variables de
# shell (HEAD_COUNT, CODE_HEAD, CURRENT) y las sustituciones de comando
# van con `$$` para que lleguen intactas al script; `$_IMAGE` y
# `$COMMIT_SHA` si son sustituciones de Cloud Build y llevan un solo `$`.

# `_REGION` estaba declarado aqui y no se usa en ningun step: el job corre
# alembic dentro de la imagen y no llama a gcloud, asi que no necesita region.
# Cloud Build rechaza el envio si una sustitucion declarada no aparece en la
# plantilla, de modo que no era decorativa: impedia ejecutar el job.
substitutions:
  _IMAGE: southamerica-west1-docker.pkg.dev/cotizador-greda/cloud-run-source-deploy/bgreda-api

steps:
  # ------------------------------------------------------------------
  # 1. Obtener imagen más reciente del backend para correr alembic
  # ------------------------------------------------------------------
  - id: pull-image
    name: gcr.io/cloud-builders/docker
    args:
      - pull
      - $_IMAGE:main-latest

  # ------------------------------------------------------------------
  # 2. Verificar precondiciones de migración
  # ------------------------------------------------------------------
  - id: check-migration-preconditions
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euc
      - |
        echo "===================================================="
        echo " BGreda — Verificación de migración Alembic"
        echo "===================================================="
        echo ""
        echo "COMMIT_SHA: $COMMIT_SHA"
        echo "Imagen: $_IMAGE:main-latest"
        echo ""
        echo "IMPORTANTE: Este job no ejecuta migración automáticamente."
        echo "Solo lo hace si PRODUCTION_CURRENT < CODE_HEAD."
        echo ""
        echo "Precondición: ALEMBIC_HEAD_COUNT debe ser 1."
        echo "Si hay múltiples heads, el job aborta y DEBE resolverse manualmente."
        echo ""
        echo "Precondición verificada en tiempo de ejecución via alembic heads."
    waitFor:
      - pull-image

  # ------------------------------------------------------------------
  # 3. Verificar heads y ejecutar migración si es necesario
  #    La DATABASE_URL se inyecta desde Secret Manager en el job real.
  #    Para CI dry-run, este step verifica solo la sintaxis offline.
  # ------------------------------------------------------------------
  - id: migrate
    name: $_IMAGE:main-latest
    entrypoint: bash
    # Cloud Build ejecuta cada step en /workspace e IGNORA el WORKDIR de la
    # imagen. Sin esto alembic no encuentra alembic.ini y falla con
    # "No 'script_location' key found in configuration".
    dir: /app
    secretEnv:
      - DATABASE_URL
    args:
      - -euc
      - |
        echo "======================================================"
        echo " Alembic: verificando estado de migración"
        echo "======================================================"
        echo "WORKDIR: $$(pwd)"

        # Sin `2>/dev/null`: tapar el stderr de alembic fue lo que permitio
        # que este job informara "no hay nada que migrar" mientras alembic
        # fallaba en todas sus invocaciones.
        if ! HEADS_OUT=$$(python -m alembic heads 2>&1); then
          echo "ERROR: 'alembic heads' fallo:"
          echo "$$HEADS_OUT"
          echo "STATUS: MIGRATION_ABORTED_ALEMBIC_ERROR"
          exit 1
        fi

        HEAD_COUNT=$$(echo "$$HEADS_OUT" | grep -c .)
        echo "ALEMBIC_HEADS: $$HEAD_COUNT"
        if [ "$$HEAD_COUNT" -ne 1 ]; then
          echo "ERROR: Se encontraron $$HEAD_COUNT heads de Alembic."
          echo "MÚLTIPLES HEADS detectados. Resolver manualmente antes de migrar."
          echo "STATUS: MIGRATION_ABORTED_MULTIPLE_HEADS"
          exit 1
        fi

        CODE_HEAD=$$(echo "$$HEADS_OUT" | awk '{print $$1}')
        echo "CODE_HEAD: $$CODE_HEAD"

        # Una revision es alfanumerica. Cualquier otra cosa —"FAILED:", vacio—
        # significa que alembic no respondio, y comparar dos respuestas rotas
        # entre si daria "iguales" y por tanto un falso "ya esta al dia".
        case "$$CODE_HEAD" in
          '' | *[!0-9A-Za-z_]* )
            echo "ERROR: CODE_HEAD no es una revisión válida: '$$CODE_HEAD'"
            echo "STATUS: MIGRATION_ABORTED_INVALID_CODE_HEAD"
            exit 1
            ;;
        esac

        if ! CURRENT_OUT=$$(python -m alembic current 2>&1); then
          echo "ERROR: 'alembic current' fallo:"
          echo "$$CURRENT_OUT"
          echo "STATUS: MIGRATION_ABORTED_ALEMBIC_ERROR"
          exit 1
        fi
        CURRENT=$$(echo "$$CURRENT_OUT" | awk '{print $$1}' | head -1)
        echo "PRODUCTION_CURRENT: $${CURRENT:-<sin sellar>}"

        # Vacio es legitimo: base nunca sellada, hay que migrar. Cualquier
        # otro valor no alfanumerico es un fallo disfrazado.
        case "$$CURRENT" in
          '' ) : ;;
          *[!0-9A-Za-z_]* )
            echo "ERROR: PRODUCTION_CURRENT no es una revisión válida: '$$CURRENT'"
            echo "STATUS: MIGRATION_ABORTED_INVALID_CURRENT"
            exit 1
            ;;
        esac

        if [ "$$CURRENT" = "$$CODE_HEAD" ]; then
          echo ""
          echo "PRODUCTION_CURRENT == CODE_HEAD"
          echo "MIGRATION_REQUIRED: NO"
          echo "ALEMBIC_UPGRADE_EXECUTED: NO"
          echo "STATUS: MIGRATION_COMPLETE"
          exit 0
        fi

        echo ""
        echo "PRODUCTION_CURRENT ($${CURRENT:-<sin sellar>}) != CODE_HEAD ($$CODE_HEAD)"
        echo "MIGRATION_REQUIRED: YES"
        echo "Ejecutando alembic upgrade head..."
        python -m alembic upgrade head
        echo "ALEMBIC_UPGRADE_EXECUTED: YES"

        echo ""
        echo "Verificando estado post-migración..."
        POST=$$(python -m alembic current 2>&1 | awk '{print $$1}' | head -1)
        echo "PRODUCTION_CURRENT: $$POST"
        if [ "$$POST" != "$$CODE_HEAD" ]; then
          echo "ERROR: tras migrar, PRODUCTION_CURRENT ($$POST) sigue sin ser CODE_HEAD ($$CODE_HEAD)."
          echo "STATUS: MIGRATION_FAILED_POST_CHECK"
          exit 1
        fi
        echo "STATUS: MIGRATION_COMPLETE"
    waitFor:
      - check-migration-preconditions

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/database-url/versions/latest
      env: DATABASE_URL

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 600s
