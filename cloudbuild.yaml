# Cloud Build — BGreda backend candidate release 010P.
# Builds a full-merge-SHA image, deploys by digest with no traffic, and verifies
# the tagged candidate without changing the service traffic allocation.

substitutions:
  _REGION: southamerica-west1
  _SERVICE: bgreda-api
  _IMAGE: southamerica-west1-docker.pkg.dev/cotizador-greda/cloud-run-source-deploy/bgreda-api
  _RELEASE_SHA: UNSET
  _RELEASE_TAG: p010p-unset
  _PHASE: 010p

steps:
  - id: validate-release-identity
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euc
      - |
        [[ '$_RELEASE_SHA' =~ ^[0-9a-f]{40}$ ]] || { echo 'RELEASE_SHA must be a full lowercase merge SHA'; exit 1; }
        [[ '$_RELEASE_TAG' == "p010p-$_RELEASE_SHA" ]] || { echo 'RELEASE_TAG must equal p010p-<full merge SHA>'; exit 1; }
        echo "RELEASE_SHA=$_RELEASE_SHA"
        echo "RELEASE_TAG=$_RELEASE_TAG"

  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile
      - --tag=$_IMAGE:$_RELEASE_TAG
      - --label=git-sha=$_RELEASE_SHA
      - --label=repository=BGreda
      - --label=phase=$_PHASE
      - .
    waitFor: [validate-release-identity]

  - id: verify-alembic-image
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -euc
      - |
        HEADS="$$(docker run --rm --entrypoint bash $_IMAGE:$_RELEASE_TAG -euc 'cd /app && python -m alembic heads')"
        printf '%s\n' "$$HEADS"
        [[ "$$(printf '%s\n' "$$HEADS" | grep -Ec '^0045([[:space:]]|$)')" == 1 ]] || { echo 'Expected exactly one Alembic head: 0045'; exit 1; }
        [[ "$$(printf '%s\n' "$$HEADS" | grep -Ec '^[[:alnum:]_-]+([[:space:]].*)?$')" == 1 ]] || { echo 'Expected exactly one Alembic head'; exit 1; }
        echo 'IMAGE_ALEMBIC_HEAD=0045'
    waitFor: [docker-build]

  - id: docker-push-release
    name: gcr.io/cloud-builders/docker
    args: [push, $_IMAGE:$_RELEASE_TAG]
    waitFor: [verify-alembic-image]

  - id: deploy-no-traffic-by-digest
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euc
      - |
        DIGEST="$$(gcloud artifacts docker images describe '$_IMAGE:$_RELEASE_TAG' --project="$PROJECT_ID" --format='value(image_summary.digest)')"
        [[ "$$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Artifact Registry did not return an immutable sha256 digest'; exit 1; }
        gcloud run deploy '$_SERVICE' \
          --image='$_IMAGE@'"$$DIGEST" \
          --region='$_REGION' \
          --project="$PROJECT_ID" \
          --no-traffic \
          --tag='$_RELEASE_TAG' \
          --update-labels=git-sha=$_RELEASE_SHA,repository=bgreda,phase=$_PHASE
        echo "IMAGE_DIGEST=$$DIGEST" > /workspace/release.env
    waitFor: [docker-push-release]

  - id: verify-candidate-and-traffic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -euc
      - |
        source /workspace/release.env
        SERVICE_JSON="$$(gcloud run services describe '$_SERVICE' --region='$_REGION' --project="$PROJECT_ID" --format=json)"
        REVISION="$$(python3 -c 'import json,sys; s=json.load(sys.stdin); t=sys.argv[1]; print(next((x.get("revisionName", "") for x in s.get("status", {}).get("traffic", []) if x.get("tag") == t), ""))' '$_RELEASE_TAG' <<< "$$SERVICE_JSON")"
        [[ -n "$$REVISION" && "$$REVISION" != null ]] || { echo 'Tagged candidate revision was not found'; exit 1; }
        TAG_URL="$$(python3 -c 'import json,sys; s=json.load(sys.stdin); t=sys.argv[1]; print(next((x.get("url", "") for x in s.get("status", {}).get("traffic", []) if x.get("tag") == t), ""))' '$_RELEASE_TAG' <<< "$$SERVICE_JSON")"
        [[ -n "$$TAG_URL" && "$$TAG_URL" != null ]] || { echo 'Candidate tag URL was not returned'; exit 1; }
        REVISION_JSON="$$(gcloud run revisions describe "$$REVISION" --region='$_REGION' --project="$PROJECT_ID" --format=json)"
        [[ "$$(python3 -c 'import json,sys; r=json.load(sys.stdin); print(next((c.get("status", "") for c in r.get("status", {}).get("conditions", []) if c.get("type") == "Ready"), ""))' <<< "$$REVISION_JSON")" == True ]] || { echo 'Candidate revision is not Ready'; exit 1; }
        [[ "$$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("spec", {}).get("containers", [{}])[0].get("image", ""))' <<< "$$REVISION_JSON")" == '$_IMAGE@'"$$IMAGE_DIGEST" ]] || { echo 'Candidate revision image does not match the immutable digest'; exit 1; }
        python3 -c 'import json,sys; s=json.load(sys.stdin); rev=sys.argv[1]; t=s.get("status", {}).get("traffic", []); candidate=sum(x.get("percent") or 0 for x in t if x.get("revisionName") == rev); total=sum(x.get("percent") or 0 for x in t if x.get("revisionName")); assert candidate == 0, f"candidate traffic={candidate}"; assert total == 100, f"service traffic total={total}"' "$$REVISION" <<< "$$SERVICE_JSON" || { echo 'Candidate must remain at 0% and existing service allocation must total 100%'; exit 1; }
        printf 'BUILD_ID=%s\nIMAGE_DIGEST=%s\nREVISION=%s\nTAG_URL=%s\nTRAFFIC_TOTAL=100\n' "$BUILD_ID" "$$IMAGE_DIGEST" "$$REVISION" "$$TAG_URL"
    waitFor: [deploy-no-traffic-by-digest]

images:
  - $_IMAGE:$_RELEASE_TAG

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
