name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ningun paso lleva continue-on-error: un fallo real debe romper el pipeline.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Instalar dependencias
        # --frozen falla si uv.lock no coincide con pyproject.toml.
        run: uv sync --frozen --python 3.12

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (formato)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        # Los smoke tests se excluyen: requieren un entorno desplegado.
        run: uv run pytest --ignore=tests/smoke --cov=app --cov-report=term-missing

      - name: Verificar que la migracion es renderizable
        # Genera el SQL en modo offline. No abre conexion alguna: la URL solo
        # selecciona el dialecto de PostgreSQL.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: uv run alembic upgrade head --sql

  docker:
    name: Imagen de contenedor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bgreda:ci

      - name: Arrancar el contenedor y comprobar /live
        env:
          CSRF_SECRET: secreto-solo-para-la-verificacion-de-ci-0001
        run: |
          docker run -d --name bgreda-ci -p 8080:8080 \
            -e APP_ENV=local \
            -e COOKIE_SECURE=false \
            -e CSRF_SECRET="$CSRF_SECRET" \
            bgreda:ci
          for intento in $(seq 1 30); do
            if curl -fsS http://localhost:8080/live; then
              echo "\nContenedor operativo"
              exit 0
            fi
            sleep 2
          done
          echo "El contenedor no respondio en /live"
          docker logs bgreda-ci
          exit 1

      - name: Comprobar que el proceso no corre como root
        run: |
          uid=$(docker exec bgreda-ci id -u)
          echo "UID del proceso: $uid"
          test "$uid" != "0"

      - name: Detener el contenedor
        if: always()
        run: docker rm -f bgreda-ci || true
