name: CI

on:
  push:
    branches: [main]
  pull_request:

# Ningun paso lleva continue-on-error: un fallo real debe romper el pipeline.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest

    # PostgreSQL real: las pruebas de concurrencia de correlativos y las de la
    # API de configuracion no tienen valor contra un motor simulado.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: greda
          POSTGRES_PASSWORD: greda
          POSTGRES_DB: greda_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://greda:greda@localhost:5432/greda_ci

    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Instalar dependencias
        # --frozen falla si uv.lock no coincide con pyproject.toml.
        run: uv sync --frozen --python 3.12

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (formato)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        # Los smoke tests se excluyen: requieren un entorno desplegado.
        # Las pruebas de tests/db si se ejecutan: TEST_DATABASE_URL apunta al
        # servicio PostgreSQL de arriba.
        run: uv run pytest --ignore=tests/smoke --cov=app --cov-report=term-missing

      - name: Comprobar que las pruebas con base de datos se ejecutaron
        # Sin esta verificacion, un fallo de conexion las omitiria en silencio
        # y la CI seguiria en verde sin haber probado la concurrencia. Desde
        # que tests/db/conftest.py omite la suite cuando falta la variable, el
        # riesgo es mayor: una TEST_DATABASE_URL vacia daria verde sin probar
        # nada. Por eso se exige la variable, al menos una prueba ejecutada y
        # cero omitidas.
        run: |
          if [ -z "${TEST_DATABASE_URL}" ]; then
            echo "TEST_DATABASE_URL no llego al runner: las pruebas con base de datos se omitirian."
            exit 1
          fi
          total=$(uv run pytest tests/db --collect-only -q 2>/dev/null | tail -1)
          echo "Pruebas de base de datos recolectadas: $total"
          uv run pytest tests/db -q --no-header | tee /tmp/db.txt
          grep -qE "[0-9]+ passed" /tmp/db.txt
          if grep -qE "[0-9]+ skipped" /tmp/db.txt; then
            echo "Las pruebas con base de datos se omitieron; TEST_DATABASE_URL no llego al runner."
            exit 1
          fi

      - name: Verificar que la migracion es renderizable
        # Genera el SQL en modo offline. No abre conexion alguna: la URL solo
        # selecciona el dialecto de PostgreSQL.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: uv run alembic upgrade head --sql

  docker:
    name: Imagen de contenedor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bgreda:ci

      - name: Arrancar el contenedor y comprobar /live
        env:
          CSRF_SECRET: secreto-solo-para-la-verificacion-de-ci-0001
        run: |
          docker run -d --name bgreda-ci -p 8080:8080 \
            -e APP_ENV=local \
            -e COOKIE_SECURE=false \
            -e CSRF_SECRET="$CSRF_SECRET" \
            bgreda:ci
          for intento in $(seq 1 30); do
            if curl -fsS http://localhost:8080/live; then
              echo "\nContenedor operativo"
              exit 0
            fi
            sleep 2
          done
          echo "El contenedor no respondio en /live"
          docker logs bgreda-ci
          exit 1

      - name: Comprobar que el proceso no corre como root
        run: |
          uid=$(docker exec bgreda-ci id -u)
          echo "UID del proceso: $uid"
          test "$uid" != "0"

      - name: Detener el contenedor
        if: always()
        run: docker rm -f bgreda-ci || true

  cloudbuild-lint:
    name: Validar configuración Cloud Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar cloudbuild.yaml — campos requeridos
        run: |
          python3 - <<'PYEOF'
          import sys
          import yaml

          configs = {
              "cloudbuild.yaml": ["steps", "images", "options", "timeout"],
              "cloudbuild.migrate.yaml": ["steps", "options", "timeout"],
          }

          errors = []
          for filename, required_keys in configs.items():
              try:
                  with open(filename, "r") as f:
                      data = yaml.safe_load(f)
              except FileNotFoundError:
                  errors.append(f"{filename}: archivo no encontrado")
                  continue
              except yaml.YAMLError as e:
                  errors.append(f"{filename}: YAML invalido — {e}")
                  continue

              for key in required_keys:
                  if key not in data:
                      errors.append(f"{filename}: falta campo requerido '{key}'")

              steps = data.get("steps", [])
              for i, step in enumerate(steps):
                  if "name" not in step:
                      errors.append(f"{filename}: step[{i}] sin 'name'")
                  if "args" not in step and "entrypoint" not in step:
                      errors.append(f"{filename}: step[{i}] sin 'args' ni 'entrypoint'")

              print(f"  {filename}: OK ({len(steps)} steps)")

          if errors:
              for e in errors:
                  print(f"ERROR: {e}", file=sys.stderr)
              sys.exit(1)
          print("Configuraciones Cloud Build: validas")
          PYEOF

      - name: Verificar scripts de deploy — sintaxis bash
        run: |
          for script in scripts/deploy-backend.sh scripts/smoke-production.sh; do
            if [ ! -f "$script" ]; then
              echo "ERROR: $script no encontrado"
              exit 1
            fi
            bash -n "$script" && echo "  $script: sintaxis OK"
          done
